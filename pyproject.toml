[project]
name = "machwave"
dynamic = ["version"]
description = "Rocket simulator"
readme = "README.md"
authors = [{ name = "Felipe Bogaerts de Mattos", email = "me@felipebm.com" }]
license = { file = "license.txt" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
keywords = ["python", "rocket", "srm", "engine", "propulsion"]
requires-python = ">=3.11,<=3.14"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "fluids>=1.1.0,<2.0.0",
    "matplotlib>=3.10.0,<4.0.0",
    "plotly>=6.0.0,<7.0.0",
    "scipy>=1.15.2,<2.0.0",
    "pandas>=2.2.3,<4.0.0",
    "scikit-image>=0.25.2,<0.27.0",
    "scikit-fmm==2025.6.23",
    "trimesh>=4.6.4,<5.0.0",
    "rocketcea>=1.2.1,<2.0.0",
    "coolprop>=6.7.0,<9.0.0",
]

[project.optional-dependencies]
rocketpy = ["rocketpy>=1.0.0,<2.0.0"]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pylint>=3.3.5,<5.0.0",
    "py2puml>=0.10.0,<0.12.0",
    "pytest-benchmark>=5.0.0,<6.0.0",
    "pytest-cov>=6.2.1,<8.0.0",
    "polyfactory>=3.1.0,<4.0.0",
    "rocketpy>=1.11.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.27.0,<1.1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "machwave/_version.py"

[project.urls]
Homepage = "https://github.com/felipebogaertsm/machwave"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["D"]
extend-select = ["D213", "D407"]
# Skipped intentionally:
#   D100, D104: module/package docstrings not required.
#   D102, D105, D107: trivial methods, magic methods, and __init__ are not
#     required to be documented (getters, simple delegations, etc.). When the
#     behavior is non-obvious, document it; otherwise let the name speak.
#   D203, D212: incompatible with Google convention.
ignore = ["D100", "D102", "D104", "D105", "D107", "D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.per-file-ignores]
# Tests, examples, scripts, and docs are exempt from docstring requirements.
"tests/**" = ["D"]
"examples/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
