name: "Setup Python and Poetry"
description: "Sets up Python, installs Poetry, restores a cached .venv, and installs deps."
inputs:
  python-version:
    required: true
  install-flags:
    default: "--no-interaction --no-root"
    description: "Extra args for `poetry install`"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        virtualenvs-path: .venv
        installer-parallel: true

    - id: cache
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ inputs.python-version }}-

    - if: steps.cache.outputs.cache-hit != 'true'
      run: poetry install ${{ inputs.install-flags }}
      shell: bash
