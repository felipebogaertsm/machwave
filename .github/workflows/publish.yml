name: Publish Machwave to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the package
        run: make build

      - name: Verify tag matches package version
        run: make verify-version

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke-test:
    name: Smoke test built wheel
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          brew_prefix=$(brew --prefix)
          gfortran_versioned=$(ls "$brew_prefix"/bin/gfortran-* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$gfortran_versioned" ]; then
            echo "::error::No gfortran-* binary found in $brew_prefix/bin after brew install gcc"
            exit 1
          fi
          ln -sf "$gfortran_versioned" "$brew_prefix/bin/gfortran"
          gfortran --version

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test
        run: |
          python -c "import machwave; print('machwave', machwave.__version__)"
          python -c "import machwave.simulation, machwave.models, machwave.core, machwave.services, machwave.adapters"

  publish:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make install-docs
      - run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
