name: Machwave CI

on: [push, pull_request]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  prepare-env:
    name: Prepare & cache venv
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Cache virtualenv
        id: cache
        uses: actions/cache/save@v3
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

  static-checks:
    name: Static Checks
    needs: prepare-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore venv
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
          key: ${{ needs.prepare-env.outputs.cache-key }}

      - name: Ruff
        run: poetry run ruff check .

      - name: Pyright
        run: poetry run pyright machwave

  test:
    name: Testing
    needs: prepare-env
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip                  # pip cache for Sphinx only

      - name: Install doc deps
        run: |
          pip install -r requirements.txt
          pip install sphinx sphinx_rtd_theme

      - name: Build docs
        run: |
          chmod +x scripts/sphinx-docs.sh
          ./scripts/sphinx-docs.sh apidoc
          ./scripts/sphinx-docs.sh html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
