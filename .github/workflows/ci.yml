name: Machwave CI

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.11"
      - run: poetry run ruff check .
      - run: poetry run pyright machwave

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.11"
      - run: poetry run pytest -q

  build-deploy-docs:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.11"
          install-flags: "--no-interaction --only docs --with dev"
      - run: |
          chmod +x scripts/sphinx-docs.sh
          ./scripts/sphinx-docs.sh apidoc
          ./scripts/sphinx-docs.sh html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - id: deploy
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
