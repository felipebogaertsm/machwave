name: Change
description: A new capability, an improvement or a cleanup.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What and why
      description: The change and the reason for it. One or two sentences for a small change.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Done when
      description: The observable result that closes this issue, and what is out of scope if it is not obvious.
  - type: textarea
    attributes:
      label: References
      description: Papers, books or data the change relies on.
