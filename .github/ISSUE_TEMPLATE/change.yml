name: Change
description: A new capability, an improvement or a cleanup.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What and why
      description: The change and the reason for it, in one or two sentences.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Scope
      description: What is out of scope, if it is not obvious.
  - type: textarea
    attributes:
      label: References
      description: Papers, books or data the change relies on.
