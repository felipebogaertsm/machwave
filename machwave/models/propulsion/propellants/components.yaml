# ============================================================
# COMPONENTS SCHEMA
# ============================================================
# - id: <string>
#     Short identifier (used in formulations). Must be unique.
#
# - rc_name: <string>
#     RocketCEA / NASA CEA species or propellant token. Passed directly to CEA.
#
# - state: <solid|fluid>
#     Physical state at storage/operating conditions. Used for validation.
#
# - default_role: <fuel|oxidizer>
#     Typical role in a formulation. Informational, not enforced.
#
# - formula: {Element: count, ...}   (optional)
#     Empirical composition if not already in RocketCEA database.
#     Example: {C: 6, H: 14, O: 6} for Sorbitol.
#
# - t_K: <float>   (optional)
#     Reference temperature in kelvin. Used in custom cards.
#
# - rho_g_per_cc: <float>   (optional)
#     Material density in grams per cubic centimeter (g/cc).
#
# - h_cal_per_g: <float>   (optional)
#     Specific enthalpy at reference state, in calories per gram (cal/g).
#
# Notes:
# - Each component is reusable across multiple formulations.
# - For non-built-in solids (e.g., Sorbitol, KNO3), provide: formula, t_K, rho_g_per_cc, h_cal_per_g.
# ============================================================

components:
  - id: AP
    rc_name: "NH4CLO4(I)"
    state: solid
    default_role: oxidizer

  - id: HTPB
    rc_name: "R-45(HTPB FROM_RPL_DATA)"
    state: solid
    default_role: fuel
    formula: {C: 7.3165, H: 10.3360, O: 0.1063}
    t_K: 298.15
    rho_g_per_cc: 0.9220
    h_cal_per_g: 1.200

  - id: AL
    rc_name: "Aluminum"
    state: solid
    default_role: fuel
    formula: {AL: 1}
    t_K: 298.15

  - id: SORBITOL
    rc_name: "Sorbitol"
    state: solid
    default_role: fuel
    formula: {C: 6, H: 14, O: 6}
    t_K: 298.15
    rho_g_per_cc: 1.49
    h_cal_per_g: -1050.0

  - id: KNO3
    rc_name: "KNO3"
    state: solid
    default_role: oxidizer
    formula: {K: 1, N: 1, O: 3}
    t_K: 298.15
    rho_g_per_cc: 2.11
    h_cal_per_g: -118.0

  - id: LOX
    rc_name: "LOX"
    state: fluid
    default_role: oxidizer

  - id: RP1
    rc_name: "RP-1"
    state: fluid
    default_role: fuel

  - id: N2O
    rc_name: "N2O"
    state: fluid
    default_role: oxidizer

  - id: CH4
    rc_name: "CH4"
    state: fluid
    default_role: fuel
